# Site settings
title: "Brian Sullivan Web Services"
url: "https://bsullivan.io"
baseurl: ""
description: "Custom websites, SEO, website maintenance and web apps for small businesses in Marcellus, Syracuse and Central New York. 15+ years of experience."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Brian Sullivan"
resume_title:                   "Senior Web Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "brian@bsullivan.io"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "732-600-6507"
resume_contact_address:         "2522 Scotch Hill Road, Marcellus, NY"

resume_header_contact_info:     "2522 Scotch Hill Road, Marcellus, NY • 732-600-6507 • brian@bsullivan.io"
display_header_contact_info:    "false"

resume_header_intro: "<p>Senior full-stack engineer with 15+ years building SaaS platforms, APIs, data pipelines, and automation across e-commerce and ad tech. Built and operated systems supporting billions of requests. Recent work includes LLM integrations, AI-assisted workflows, and agentic systems.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    false
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/bsullivan-io"
  resume_twitter_url:           "http://twitter.com/bsullivanwrites"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/brian-sullivan-8a896166/"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "http://bsullivan.io"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts

# Local planning notes are not part of the published site.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - TASK_BOARD.md
  - Tasks
  - .obsidian

# Google Analytics 4 — bsullivan.io web stream
google_analytics_id: "G-B3Q2T69LFW"
