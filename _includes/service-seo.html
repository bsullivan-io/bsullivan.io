{% assign seo_title = page.title | default: site.title %}
{% assign seo_description = page.description | default: site.description %}
{% assign seo_url = page.url | absolute_url %}
<title>{{ seo_title | escape }}</title>
<meta name="description" content="{{ seo_description | escape }}">
<link rel="canonical" href="{{ seo_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="Brian Sullivan Web Services">
<meta property="og:title" content="{{ seo_title | escape }}">
<meta property="og:description" content="{{ seo_description | escape }}">
<meta property="og:url" content="{{ seo_url }}">
<meta property="og:image" content="{{ '/images/social-preview.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Brian Sullivan Web Services — websites, SEO and web apps for small businesses in Marcellus and Syracuse, NY">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title | escape }}">
<meta name="twitter:description" content="{{ seo_description | escape }}">
<meta name="twitter:image" content="{{ '/images/social-preview.png' | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://bsullivan.io/#business",
  "name": "Brian Sullivan Web Services",
  "url": "https://bsullivan.io/",
  "image": "https://bsullivan.io/images/social-preview.png",
  "description": "Website design, SEO, website maintenance and custom web applications for small businesses in Marcellus, Syracuse and Central New York.",
  "email": {{ site.resume_contact_email | jsonify }},
  "founder": { "@type": "Person", "name": "Brian Sullivan" },
  "areaServed": ["Marcellus, NY", "Syracuse, NY", "Central New York"],
  "sameAs": ["https://www.facebook.com/profile.php?id=61595393150410", "https://github.com/bsullivan-io", "https://www.linkedin.com/in/brian-sullivan-8a896166/"]
}
</script>
{% if page.service_name %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ page.service_name | jsonify }},
  "description": {{ seo_description | jsonify }},
  "url": {{ seo_url | jsonify }},
  "provider": { "@id": "https://bsullivan.io/#business" },
  "areaServed": ["Marcellus, NY", "Syracuse, NY", "Central New York"]
}
</script>
{% endif %}
